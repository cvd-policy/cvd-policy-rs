name: Rust release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package verified crate
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Verify tag and main ancestry
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cvd-policy"))')"
          test "$RELEASE_TAG" = "v$version" || {
            echo "tag $RELEASE_TAG does not match Cargo package version $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify package archive
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cargo package --locked --list
          cargo package --locked
          archive="target/package/cvd-policy-${RELEASE_VERSION}.crate"
          test -f "$archive"
          assets=target/release-assets
          mkdir -p "$assets"
          cp "$archive" "$assets/"
          cat > "$assets/consumer-git-pin.toml" <<EOF
          [dependencies]
          cvd-policy = { git = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}", rev = "${GITHUB_SHA}" }
          EOF
          (cd "$assets" && sha256sum -- *.crate > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cvd-policy-${{ steps.release.outputs.version }}-release-assets
          path: target/release-assets/
          if-no-files-found: error

  publish-crates-io:
    name: Publish to crates.io
    needs: package
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cvd-policy-${{ needs.package.outputs.version }}-release-assets
          path: target/release-assets/
      - name: Verify approved package archive
        run: (cd target/release-assets && sha256sum -c SHA256SUMS)
      - name: Rebuild package and compare approved bytes
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          cargo package --locked
          cmp "target/package/cvd-policy-${RELEASE_VERSION}.crate" \
            "target/release-assets/cvd-policy-${RELEASE_VERSION}.crate"
      - name: Request short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$tag_sha" = "$GITHUB_SHA"
          cargo publish --locked
      - name: Verify published package archive bytes
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          cmp "target/package/cvd-policy-${RELEASE_VERSION}.crate" \
            "target/release-assets/cvd-policy-${RELEASE_VERSION}.crate"

  github-release:
    name: Create GitHub release
    needs: [package, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cvd-policy-${{ needs.package.outputs.version }}-release-assets
          path: target/release-assets/
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          (cd target/release-assets && sha256sum -c SHA256SUMS)
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "$tag_sha" = "$GITHUB_SHA"
          release_flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${release_flags[@]}" target/release-assets/*.crate \
            target/release-assets/SHA256SUMS target/release-assets/consumer-git-pin.toml
